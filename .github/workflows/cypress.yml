name: Cypress Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./client/music_journal
          build: npm run build
          start: npm run dev
          wait-on: http://localhost:5173
        env:
          VITE_API_URL: https://testing-backend-mongo-music-journal.onrender.com